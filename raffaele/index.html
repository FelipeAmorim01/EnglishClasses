<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>English Classes — Class Library</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f2ee;
        --surface: #ffffff;
        --surface2: #ede9e3;
        --border: #d8d2c8;
        --accent: #2d5f3f;
        --accent-light: #e8f0eb;
        --accent2: #b85c2a;
        --text: #1a1a18;
        --muted: #7a7368;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 15px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* HEADER */
      header {
        background: var(--surface);
        padding: 20px 40px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header h1 {
        font-family: "Lora", serif;
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: -0.01em;
      }

      header .subtitle {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 2px;
        letter-spacing: 0.03em;
      }

      .tag {
        font-size: 0.7rem;
        border: 1px solid var(--border);
        padding: 3px 10px;
        border-radius: 2px;
        color: var(--muted);
        background: var(--bg);
      }

      /* CONTENT */
      main {
        flex: 1;
        padding: 52px 52px 64px;
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
      }

      .page-eyebrow {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .page-title {
        font-family: "Lora", serif;
        font-size: 2rem;
        font-weight: 600;
        line-height: 1.15;
        margin-bottom: 6px;
      }

      .page-title em {
        color: var(--accent);
        font-style: italic;
      }

      .page-sub {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 36px;
        line-height: 1.5;
      }

      .section-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 12px;
      }

      /* LESSON CARDS */
      .lesson-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }

      .lesson-card {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 18px 20px 16px;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
        transition:
          border-color 0.15s,
          transform 0.15s;
        animation: fadeUp 0.25s ease;
      }

      .lesson-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .lesson-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .lesson-title {
        font-family: "Lora", serif;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--accent2);
        margin-bottom: 8px;
        line-height: 1.3;
      }

      .lesson-desc {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 16px;
      }

      .lesson-open {
        margin-top: auto;
        align-self: flex-start;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        padding: 8px 18px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        transition: all 0.12s;
      }

      .lesson-card:hover .lesson-open {
        background: #1e4a2e;
        border-color: #1e4a2e;
      }

      /* SOON / EMPTY */
      .lesson-card.soon {
        border-style: dashed;
        cursor: default;
        opacity: 0.7;
      }

      .lesson-card.soon:hover {
        border-color: var(--border);
        transform: none;
      }

      .lesson-card.soon .lesson-open {
        background: none;
        border-color: var(--border);
        color: var(--muted);
      }

      .lesson-card.soon:hover .lesson-open {
        background: none;
        border-color: var(--border);
      }

      /* FOOTER */
      footer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 16px 40px;
        font-size: 0.72rem;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      @media (max-width: 720px) {
        header,
        footer {
          padding-left: 24px;
          padding-right: 24px;
        }
        main {
          padding: 36px 24px 48px;
        }
        .lesson-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>English Classes</h1>
        <div class="subtitle">Class Library — Raffaele</div>
      </div>
      <span class="tag" id="lesson-count"></span>
    </header>

    <main>
      <div class="page-eyebrow">All classes</div>
      <div class="page-title">Your <em>lessons</em></div>
      <div class="page-sub">
        Pick a class to review the material. New lessons are added here after
        each session.
      </div>

      <div class="section-label">Available now</div>
      <div class="lesson-grid" id="lesson-grid"></div>
    </main>

    <footer>
      <span>Updated after each class</span>
    </footer>

    <script>
      /* ------------------------------------------------------------------
         TO ADD A NEW CLASS: copy one block below, change the values, done.
         - file:   name of the html file (must sit in the same folder)
         - title:  shown in orange
         - date:   day of the class, e.g. "21 August 2026"
         - desc:   one-line summary
         - soon:   set to true for a class that isn't ready yet (no link)

         Lessons are numbered from 0 in the order they appear in this list,
         so just append new ones at the bottom.
      ------------------------------------------------------------------ */
      const LESSONS = [
        {
          file: "lesson_plan_0.html",
          title: "Getting Started",
          date: "6 August 2026",
          desc: "Experimental lesson: talking about your work, upgrading everyday vocabulary, and defending decisions as CEO for a day.",
        },
        {
          file: "lesson_plan_1.html",
          title: "Negotiation & Workplace Conflict",
          date: "14 August 2026",
          desc: "Diplomatic language for disagreement, pushing back politely, and holding your ground at the negotiation table.",
        },
        // {
        //   file: "lesson_plan_2.html",
        //   title: "Gessica",
        //   date: "14 August 2029",
        //   desc: "Diplomatic language for disagreement, pushing back politely, and holding your ground at the negotiation table.",
        // },
      ];

      const grid = document.getElementById("lesson-grid");

      LESSONS.forEach((lesson, i) => {
        const card = document.createElement(lesson.soon ? "div" : "a");
        card.className = "lesson-card" + (lesson.soon ? " soon" : "");
        if (!lesson.soon) card.href = lesson.file;

        card.innerHTML = `
          <div class="lesson-meta">
            <span>Lesson ${i}</span>
            <span>${lesson.date || ""}</span>
          </div>
          <div class="lesson-title">${lesson.title}</div>
          <div class="lesson-desc">${lesson.desc}</div>
          <span class="lesson-open">${lesson.soon ? "Coming soon" : "Open lesson"}</span>
        `;

        grid.appendChild(card);
      });

      const ready = LESSONS.filter((l) => !l.soon).length;
      document.getElementById("lesson-count").textContent =
        ready + (ready === 1 ? " lesson" : " lessons");
    </script>
  </body>
</html>
